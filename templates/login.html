<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty & Admin Login - BIO-SECURE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 440px;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container p-3">
    <div class="login-card mx-auto p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="text-primary fs-1 mb-2">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="fw-bold m-0 text-white">BIO-SECURE</h3>
            <p class="text-secondary small mt-1">Faculty & Admin Portal</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 small d-flex align-items-center mb-3" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="username" name="username" required autofocus placeholder="admin / teacher">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password" name="password" required placeholder="Enter your password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </button>
        </form>

        <div class="text-center pt-2 border-top border-secondary">
            <a href="/" class="text-secondary text-decoration-none small">
                <i class="fa-solid fa-arrow-left me-1"></i> Return to Attendance Kiosk
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
